services:
#-------------------- PROMETHEUS --------------------------#

  prometheus-master:
    container_name: cprometheus
    hostname: host-prometheus
    image: prom/prometheus
    privileged: true
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./volume/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.console.libraries=/usr/share/prometheus/console_libraries", "--web.console.templates=/usr/share/prometheus/consoles", "--web.enable-lifecycle", "--web.enable-remote-write-receiver"]


#-------------------- GRAFANA --------------------------#

  grafana:
    container_name: cgrafana
    hostname: host-grafana
    image: grafana/grafana
    privileged: true
    restart: unless-stopped
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - TZ=Europe/Istanbul
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "./volume/grafana/etc/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
      - "./volume/grafana/etc/grafana/grafana.ini:/etc/grafana/grafana.ini"
#      - "./volume/grafana/var/lib/grafana:/var/lib/grafana/"
    ports:
    - 3000:3000

#-------------------- LOKI --------------------------#

  loki:
    container_name: cloki
    hostname: host-loki
    image: grafana/loki
    command: -config.file=/etc/loki/local-config.yaml
    privileged: true
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "./volume/loki/mnt/config:/mnt/config"
      - "./volume/loki/loki:/loki"
    ports:
    - 3100:3100

#-------------------- PROMTAIL --------------------------#

  promtail:
    container_name: cpromtail
    image: grafana/promtail:2.4.0
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
#      - "./volume/promtail/promtail-config.yaml:/etc/promtail/config.yml"
    command: -config.file=/etc/promtail/config.yml
    ports:
    - 9080:9080
